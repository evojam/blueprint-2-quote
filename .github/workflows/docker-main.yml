name: Build main image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Only the newest main commit is worth an image; cancel a build it superseded.
  group: docker-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          # ECS Fargate tasks here declare no runtime_platform, so they run x86_64.
          # A default build on an Apple-silicon runner/laptop produces arm64 and ECS
          # rejects it with "no matching manifest".
          platforms: linux/amd64
          # `:main` is mutable on purpose — deploy does force-new-deployment.
          # `:sha-<short>` is the immutable escape hatch to pin a known-good build.
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
